name: Auto-Build & Publish Parquet Database Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prime_limit:
        description: 'Target Prime Limit (N)'
        required: true
        default: '10000000000'
        type: string
      gap_k:
        description: 'Gap Step Size (k)'
        required: true
        default: '2'
        type: string
      release_tag:
        description: 'Release Tag Name'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Parquet Databases & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --release

      - name: Build Prime Parquet Database
        run: |
          LIMIT="${{ inputs.prime_limit || '100000000' }}"
          echo "Building primes database up to limit N=$LIMIT..."
          cargo run --release --bin build_primes -- $LIMIT

      - name: Build Gap Parquet Database
        run: |
          K="${{ inputs.gap_k || '2' }}"
          echo "Building k=$K step gap database..."
          cargo run --release --bin build_gaps -- $K

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release & Upload Parquet Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Database Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## 📦 Pre-Computed Prime & Gap Parquet Databases
            Automated build generated by Jump Champ Rust pipeline.

            * **`primes.parquet`**: Prime numbers sieved with bitpacked Rayon parallel sieve & ZSTD Delta compression.
            * **`gaps2.parquet`**: Pre-computed 2-step prime gap single-column database ready for zero-copy DuckDB analytics.
          files: |
            primes.parquet
            gaps*.parquet
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
