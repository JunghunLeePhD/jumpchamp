name: Build & Release Desktop GUI App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-gui:
    name: Build GUI App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: jumpchamp_gui-windows-x86_64.exe
            is_macos: false

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: JumpChamp-macos-arm64.app.zip
            is_macos: true

          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: JumpChamp-macos-intel-x86_64.app.zip
            is_macos: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: jumpchamp_gui-linux-x86_64
            is_macos: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libxkbcommon-dev libwayland-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle (macOS)
        if: matrix.is_macos == true
        run: cargo install cargo-bundle

      - name: Build & Package GUI App
        run: |
          if [ "${{ matrix.is_macos }}" = "true" ]; then
            cargo bundle --release --target ${{ matrix.target }} --bin jumpchamp_gui
            cd target/${{ matrix.target }}/release/bundle/osx
            zip -r ../../../../../${{ matrix.asset_name }} JumpChamp.app
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo build --release --target ${{ matrix.target }} --bin jumpchamp_gui
            cp target/${{ matrix.target }}/release/jumpchamp_gui.exe ${{ matrix.asset_name }}
          else
            cargo build --release --target ${{ matrix.target }} --bin jumpchamp_gui
            cp target/${{ matrix.target }}/release/jumpchamp_gui ${{ matrix.asset_name }}
          fi
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish Release & Attach Binary Executables
    needs: build-gui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "JumpChamp GUI App Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## 🚀 Native Desktop GUI Executables (${{ steps.release_tag.outputs.tag }})

            Pre-compiled standalone desktop executables for **JumpChamp Prime Gap Explorer**.

            ### 📦 Downloads:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `JumpChamp-macos-arm64.app.zip` *(Double-clickable .app bundle)*
            - **macOS (Intel x86_64)**: `JumpChamp-macos-intel-x86_64.app.zip` *(Double-clickable .app bundle)*
            - **Windows (64-bit)**: `jumpchamp_gui-windows-x86_64.exe`
            - **Linux (x86_64)**: `jumpchamp_gui-linux-x86_64`

            ---

            ### 🍏 macOS First-Time Launch Instructions:
            1. Download and double-click `JumpChamp-macos-arm64.app.zip` (or Intel version) to unzip.
            2. **Right-click** (or Control-click) `JumpChamp.app`, select **Open**, and click **Open** on the security popup.
            3. *Done!* Subsequent launches will work with a simple **double-click**.
          files: release-artifacts/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

