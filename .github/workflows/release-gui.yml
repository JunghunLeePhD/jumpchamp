name: Build & Release Desktop GUI App (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-gui:
    name: Build GUI App (${{ matrix.arch_title }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_title: "Apple Silicon M-Series"
            asset_name: JumpChamp-macos-arm64.app.zip

          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch_title: "Intel x86_64"
            asset_name: JumpChamp-macos-intel-x86_64.app.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build, Sign & Package macOS App
        run: |
          cargo bundle --release --target ${{ matrix.target }} -p jumpchamp-gui --bin jumpchamp_gui
          codesign --force --deep --sign - target/${{ matrix.target }}/release/bundle/osx/JumpChamp.app
          codesign -dvv target/${{ matrix.target }}/release/bundle/osx/JumpChamp.app
          cd target/${{ matrix.target }}/release/bundle/osx
          zip -r ../../../../../${{ matrix.asset_name }} JumpChamp.app
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish Release & Attach macOS Executables
    needs: build-gui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compute Artifact Checksums
        run: |
          echo "=== Release Artifact Checksums ==="
          sha256sum release-artifacts/*/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "JumpChamp GUI App Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## 🚀 Native Desktop GUI App for macOS (${{ steps.release_tag.outputs.tag }})

            Pre-compiled standalone desktop executables for **JumpChamp Prime Gap Explorer**.

            ### 🍺 Install via Homebrew:
            ```bash
            brew install --cask JunghunLeePhD/tap/jumpchamp
            ```

            ---

            ### 📦 Direct Downloads:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `JumpChamp-macos-arm64.app.zip` *(Double-clickable .app bundle)*
            - **macOS (Intel x86_64)**: `JumpChamp-macos-intel-x86_64.app.zip` *(Double-clickable .app bundle)*

            ---

            ### 🍏 First-Time Launch Instructions:
            1. Download and double-click `JumpChamp-macos-arm64.app.zip` (or Intel version) to unzip.
            2. Move `JumpChamp.app` to your `/Applications` folder.
            3. **Right-click** (or Control-click) `JumpChamp.app`, select **Open**, and click **Open** on the security prompt.
          files: release-artifacts/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
