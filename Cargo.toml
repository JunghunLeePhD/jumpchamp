[package]
name = "jumpchamp"
version = "0.1.0"
edition = "2021"
default-run = "jumpchamp"   # cargo run -> Native Desktop GUI (src/main.rs)

[[bin]]
name = "jumpchamp_gui"
path = "src/bin/jumpchamp_gui.rs"

[dependencies]
rayon = "1.10"
eframe = "0.30"
egui = "0.30"
egui_plot = "0.30"
crossbeam-channel = "0.5"

[package.metadata.bundle]
name = "JumpChamp"
identifier = "com.jumpchamp.gui"
icon = [
    "assets/32x32.png",
    "assets/128x128.png",
    "assets/256x256.png",
    "assets/512x512.png"
]
version = "0.1.0"
copyright = "Copyright (c) 2026"
short_description = "JumpChamp Prime Gap Explorer"
long_description = "Interactive desktop application for exploring prime gap distributions."