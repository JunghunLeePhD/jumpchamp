[package]
name = "jumpchamp"
version = "0.1.0"
edition = "2021"
default-run = "jumpchamp"   # cargo run -> analyzer (src/main.rs)

[[bin]]
name = "jumpchamp_gui"
path = "src/bin/jumpchamp_gui.rs"

[dependencies]
rayon = "1.10"
arrow-array = "53.0"
arrow-schema = "53.0"
parquet = { version = "53.0", features = ["arrow"] }
eframe = "0.30"
egui = "0.30"
egui_plot = "0.30"
crossbeam-channel = "0.5"
rfd = "0.15"
dirs = "5.0"

[package.metadata.bundle]
name = "JumpChamp"
identifier = "com.jumpchamp.gui"
version = "0.1.0"
copyright = "Copyright (c) 2026"
short_description = "JumpChamp Prime Gap Explorer"
long_description = "Interactive desktop application for exploring prime gap distributions."